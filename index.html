<!DOCTYPE html>
<html lang="hi" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SGS TEST SERIES - Admin Control Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel { background: rgba(13, 17, 28, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .rwa-card { background: linear-gradient(145deg, #0d1220 0%, #111827 100%); border: 1px solid rgba(255, 255, 255, 0.06); }
    </style>
</head>
<body class="text-[#f1f5f9] font-sans bg-[#030712] min-h-screen">
    <!-- Admin Console -->
    <div id="adminCoreConsole" class="fixed inset-0 bg-[#030712] flex flex-col z-[500] p-6">
        <header class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-purple-400">Admin Control Panel</h2>
            <button onclick="window.location.reload()" class="bg-slate-800 px-4 py-2 rounded-xl text-xs">Close</button>
        </header>

        <div id="adminUsersSection" class="glass-panel p-6 rounded-2xl">
            <table class="w-full text-left font-mono text-xs">
                <thead>
                    <tr class="text-slate-400 uppercase border-b border-slate-800">
                        <th class="p-3">Student Email</th>
                        <th class="p-3">Access Status</th>
                        <th class="p-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="adminUsersStream" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit Access Modal -->
    <div id="editAccessModal" class="fixed inset-0 bg-black/80 z-[1000] hidden items-center justify-center p-4">
        <div class="glass-panel p-6 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-lg font-bold text-white" id="editModalTitle">Grant Access</h3>
            <div id="courseCheckboxes" class="space-y-2 text-sm text-slate-300">
                <!-- Courses injected here -->
            </div>
            <button onclick="saveAdminChanges()" class="w-full bg-indigo-600 py-2 rounded-xl font-bold">Save Changes</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxik7a3hTld_a4_exiwj38yRsHPV9IqG0",
            databaseURL: "https://sgs-updates-default-rtdb.firebaseio.com",
            projectId: "sgs-updates"
        };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let currentEditingUid = null;
        const courses = ["SSC GD", "BIHAR POLICE", "BSF HCM", "RRB RAILWAY", "COMPUTER", "HINDI"];

        window.syncAdminUsersList = function() {
            onValue(ref(database, 'users'), (snap) => {
                const data = snap.val();
                const stream = document.getElementById('adminUsersStream');
                stream.innerHTML = '';
                Object.keys(data).forEach(uid => {
                    const u = data[uid];
                    stream.innerHTML += `
                        <tr class="border-b border-slate-800">
                            <td class="p-3">${u.email}</td>
                            <td class="p-3">${u.isPaidUser ? 'MASTER PASS 👑' : 'TRIAL'}</td>
                            <td class="p-3 text-right space-x-2">
                                <button onclick="openEditModal('${uid}')" class="px-3 py-1 bg-purple-600 rounded-lg text-[10px]">EDIT</button>
                                <button onclick="deleteUser('${uid}')" class="px-3 py-1 bg-rose-600 rounded-lg text-[10px]">DELETE</button>
                            </td>
                        </tr>
                    `;
                });
            });
        };

        window.openEditModal = function(uid) {
            currentEditingUid = uid;
            const container = document.getElementById('courseCheckboxes');
            container.innerHTML = `<label><input type="checkbox" id="masterPassCheck"> Full Master Pass 👑</label><hr>`;
            courses.forEach(c => {
                container.innerHTML += `<label class="block"><input type="checkbox" class="course-check" value="${c}"> ${c} Pass</label>`;
            });
            document.getElementById('editAccessModal').classList.remove('hidden');
        };

        window.saveAdminChanges = function() {
            const updates = { isPaidUser: document.getElementById('masterPassCheck').checked };
            const selectedCourses = {};
            document.querySelectorAll('.course-check:checked').forEach(cb => selectedCourses[cb.value] = true);
            updates.unlockedCourses = selectedCourses;

            update(ref(database, `users/${currentEditingUid}`), updates).then(() => {
                document.getElementById('editAccessModal').classList.add('hidden');
                alert("Updated successfully!");
            });
        };

        window.deleteUser = function(uid) {
            if(confirm("Are you sure?")) set(ref(database, `users/${uid}`), null);
        };

        window.syncAdminUsersList();
    </script>
</body>
</html>
